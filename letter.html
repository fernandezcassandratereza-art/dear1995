<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    /* Pretty links (/letter/abc123): point relative files back to the site folder. */
    (function () {
      var m = /^(.*\/)letter\/[^\/]+\/?$/.exec(location.pathname);
      if (m) document.write('<base href="' + m[1].replace(/"/g, "") + '">');
    })();
  </script>
  <title>A letter for you · DEAR, 1995</title>
  <meta name="description" content="Someone wrote you a letter. Open it.">
  <meta name="robots" content="noindex">
  <meta property="og:title" content="You've got a letter · DEAR, 1995">
  <meta property="og:description" content="Someone wrote you a letter. Tap to open it.">
  <meta name="theme-color" content="#3b2a24">
  <link rel="icon" href="assets/decorations/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/letter.css">
</head>
<body class="page-letter">
  <main id="letter-root" class="letter-root">
    <div class="lt-loading" role="status">
      <img src="assets/decorations/wax-seal.svg" alt="" class="lt-loading__seal">
      <p>Your letter is on its way…</p>
    </div>
  </main>
  <script src="js/app.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/recipient.js"></script>
</body>
</html>
